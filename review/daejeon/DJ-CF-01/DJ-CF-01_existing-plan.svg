<text x="980" y="210" class="label" text-anchor="start">도면 읽기</text>
<text x="980" y="255" class="label" text-anchor="start">01  유지 요소</text>
<text x="980" y="285" class="sm" text-anchor="start">D1 · W1 · W2 · C1 · K1 · S1 유지</text>
<text x="980" y="327" class="label" text-anchor="start">02  변경 가능한 영역</text>
<text x="980" y="357" class="sm" text-anchor="start">Z1의 이동식 가구 / 마감 색감 / 조명 표현</text>
<text x="980" y="399" class="label" text-anchor="start">03  서비스 영역</text>
<text x="980" y="429" class="sm" text-anchor="start">S1의 점선은 기능 구분선이며 벽체가 아님</text>
<text x="980" y="471" class="label" text-anchor="start">04  개구부 높이</text>
<text x="980" y="501" class="sm" text-anchor="start">D1: H2200 / W1: 하단600~상단2400</text>
<text x="980" y="543" class="sm" text-anchor="start">W2: 하단900~상단2200</text>
<text x="980" y="585" class="label" text-anchor="start">05  공간 조건</text>
<text x="980" y="615" class="sm" text-anchor="start">천장 H3000 / 기준 영역 80㎡</text>
<text x="980" y="657" class="sm" text-anchor="start">벽 두께 180은 시각화용 설정, 구조 판단 불가</text>
<text x="980" y="699" class="label" text-anchor="start">06  카메라</text>
<text x="980" y="729" class="sm" text-anchor="start">01 남측 / 02 북서측 / 03 남서측</text>
<text x="980" y="771" class="sm" text-anchor="start">눈높이 1500 / 기준 화각 28mm</text>
<text x="980" y="813" class="label" text-anchor="start">07  과제 범위</text>
<text x="980" y="843" class="sm" text-anchor="start">12~16석은 교육용 목표, 법적 수용인원 아님</text>
<text x="980" y="885" class="sm" text-anchor="start">완성 가구 배치 정답은 포함하지 않음</text>
<text x="980" y="945" class="sm" text-anchor="start">범례: 굵은 실선 = 기존 벽체 / 회색 = 고정 요소</text>
<text x="980" y="975" class="sm" text-anchor="start">점선 = 기능 경계 / 파란 화살표 = 카메라 방향</text>
