<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t-pv d-pv">
  <title id="t-pv">도면 아웃페인팅 Pivot 이동 원리 및 4대 건축 카메라 구도 안내</title>
  <desc id="d-pv">원본 도면의 배치 기준점(Pivot)을 한쪽으로 옮겨 빈 확장 여백을 확보하는 아웃페인팅 원리와 탑뷰·버드뷰·조감도·눈높이 시점의 차이를 나타낸 도식</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .t-h1 { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
      .t-h2 { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 800; fill: #1e3a8a; }
      .t-sub { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 12px; fill: #475569; }
      .t-b { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 12.2px; font-weight: 700; fill: #0f172a; }
      .t-en { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f766e; }
      .t-bad { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 11.5px; font-weight: 700; fill: #b91c1c; }
      .t-ok { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 11.5px; font-weight: 700; fill: #065f46; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1e3a8a" />
    </marker>
  </defs>
  <rect class="bg" width="1200" height="620" rx="14" />

  <!-- TOP BAND: Pivot Shift Principle -->
  <text class="t-h1" x="28" y="36">① 아웃페인팅(Outpainting) 핵심 원리 · 원본 도면의 Pivot(배치 기준점) 이동</text>
  <text class="t-sub" x="28" y="57">원본이 화면 중앙에 꽉 차 있으면 AI가 바깥 공간을 그릴 여백이 없습니다. 먼저 원본의 Pivot을 한쪽으로 옮겨 확장할 방향에 빈 여백을 만듭니다.</text>

  <!-- Step A: Centered (Blocked) -->
  <rect class="box" x="28" y="74" width="346" height="222" />
  <text class="t-bad" x="46" y="99">✕ 중앙 꽉 찬 배치 (확장 여백 부족)</text>
  <rect x="48" y="112" width="306" height="136" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="6" />
  <rect x="74" y="128" width="254" height="104" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2" />
  <circle cx="201" cy="180" r="6" fill="#dc2626" />
  <text class="t-b" x="148" y="168">기존 도면 (중앙)</text>
  <text class="t-sub" x="158" y="202">Pivot = 정중앙</text>
  <text class="t-sub" x="48" y="272">우측에 빈 공간이 없어 증축·테라스를</text>
  <text class="t-sub" x="48" y="288">요청하면 기존 도면이 억지로 축소·변형됨</text>

  <line x1="382" y1="185" x2="418" y2="185" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)" />

  <!-- Step B: Pivot Shifted Left -->
  <rect class="box" x="426" y="74" width="346" height="222" />
  <text class="t-h2" x="444" y="99">Step 1 · Pivot을 좌측으로 이동 (여백 확보)</text>
  <rect x="446" y="112" width="306" height="136" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8" rx="6" />
  <rect x="456" y="128" width="166" height="104" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2" />
  <circle cx="456" cy="180" r="6" fill="#0f766e" />
  <text class="t-b" x="478" y="175">기존 도면 고정</text>
  <text class="t-sub" x="478" y="194">(Pivot 좌측 정렬)</text>
  <rect x="626" y="128" width="118" height="104" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="6 4" />
  <text class="t-ok" x="642" y="175">확장할 흰 여백</text>
  <text class="t-sub" x="644" y="194">(테라스·증축)</text>
  <text class="t-sub" x="446" y="272">PPT·그림판·ChatGPT로 캔버스를 넓히고</text>
  <text class="t-sub" x="446" y="288">원본을 좌측에 배치해 우측 빈 여백 확보</text>

  <line x1="780" y1="185" x2="816" y2="185" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)" />

  <!-- Step C: Outpainted -->
  <rect class="box" x="824" y="74" width="348" height="222" />
  <text class="t-ok" x="842" y="99">✓ Step 2 · ChatGPT 여백 확장 완성</text>
  <rect x="844" y="112" width="308" height="136" fill="#ffffff" stroke="#0f766e" stroke-width="1.8" rx="6" />
  <rect x="854" y="128" width="166" height="104" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2" />
  <text class="t-b" x="874" y="184">기존 도면 유지</text>
  <rect x="1020" y="128" width="122" height="104" fill="#fef3c7" stroke="#0f766e" stroke-width="2" />
  <line x1="1020" y1="148" x2="1142" y2="148" stroke="#d97706" stroke-width="1" />
  <line x1="1020" y1="168" x2="1142" y2="168" stroke="#d97706" stroke-width="1" />
  <line x1="1020" y1="188" x2="1142" y2="188" stroke="#d97706" stroke-width="1" />
  <line x1="1020" y1="208" x2="1142" y2="208" stroke="#d97706" stroke-width="1" />
  <circle cx="1118" cy="146" r="10" fill="#86efac" stroke="#15803d" stroke-width="1.5" />
  <circle cx="1118" cy="212" r="10" fill="#86efac" stroke="#15803d" stroke-width="1.5" />
  <text class="t-b" x="1032" y="184">데크·조경 확장</text>
  <text class="t-sub" x="844" y="272">좌측 기존 벽·가구는 그대로 유지하고</text>
  <text class="t-sub" x="844" y="288">우측 여백에만 같은 선 스타일로 확장 생성</text>

  <!-- BOTTOM BAND: 4 Architectural Camera Views -->
  <text class="t-h1" x="28" y="344">② 응용 확장 시 선택하는 4대 카메라 구도 · 시점별 프롬프트 키워드</text>
  <text class="t-sub" x="28" y="365">도면 수정(탑뷰)에서 나아가 대지·조경·외부 맥락을 확장할 때는 아래 4가지 시점 키워드를 목적에 맞게 조합합니다.</text>

  <!-- View 1: Top View -->
  <rect class="box" x="28" y="382" width="272" height="212" />
  <text class="t-h2" x="46" y="408">1. 탑뷰 · 정사영 평면</text>
  <text class="t-en" x="46" y="426">Orthographic Top-Down Plan</text>
  <rect x="46" y="438" width="236" height="84" fill="#f1f5f9" rx="6" />
  <rect x="114" y="454" width="100" height="52" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
  <line x1="164" y1="442" x2="164" y2="452" stroke="#0f766e" stroke-width="2.5" />
  <polygon points="164,455 159,448 169,448" fill="#0f766e" />
  <text class="t-sub" x="46" y="544">• 수직 90° 내려다봄 (투시 왜곡 없음)</text>
  <text class="t-sub" x="46" y="562">• 클린업 · 가구 배치 · 데크 평면 확장</text>
  <text class="t-sub" x="46" y="580">• 평면 비율·동선·조경 배치 검토 최적</text>

  <!-- View 2: Bird's-Eye View -->
  <rect class="box" x="318" y="382" width="272" height="212" />
  <text class="t-h2" x="336" y="408">2. 버드뷰 · 부감도</text>
  <text class="t-en" x="336" y="426">Bird's-Eye View / High-Angle</text>
  <rect x="336" y="438" width="236" height="84" fill="#f1f5f9" rx="6" />
  <polygon points="415,496 454,468 504,480 465,508" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2" />
  <polygon points="415,496 465,508 465,518 415,506" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5" />
  <line x1="390" y1="448" x2="432" y2="472" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr)" />
  <text class="t-sub" x="336" y="544">• 상공 45°~60° 각도에서 대지 조망</text>
  <text class="t-sub" x="336" y="562">• 지붕 형태 · 중정 · 외부 데크·식재 연계</text>
  <text class="t-sub" x="336" y="580">• 아웃페인팅으로 주변 조경 추가 시 효과적</text>

  <!-- View 3: Aerial Perspective -->
  <rect class="box" x="608" y="382" width="272" height="212" />
  <text class="t-h2" x="626" y="408">3. 조감도 · 드론 뷰</text>
  <text class="t-en" x="626" y="426">Aerial Perspective / Drone View</text>
  <rect x="626" y="438" width="236" height="84" fill="#f1f5f9" rx="6" />
  <polygon points="695,486 750,466 800,480 745,500" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2" />
  <polygon points="695,486 745,500 745,516 695,502" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5" />
  <polygon points="745,500 800,480 800,496 745,516" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5" />
  <line x1="654" y1="454" x2="692" y2="472" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr)" />
  <text class="t-sub" x="626" y="544">• 25°~35° 원거리 상공 시점 (단지·도로 포함)</text>
  <text class="t-sub" x="626" y="562">• 건물 매스 + 전면 도로 + 주변 도시 맥락</text>
  <text class="t-sub" x="626" y="580">• 공모전·발주처 제안서 메인 컷에 활용</text>

  <!-- View 4: Eye-Level -->
  <rect class="box" x="898" y="382" width="274" height="212" />
  <text class="t-h2" x="916" y="408">4. 눈높이 · 보행자 투시도</text>
  <text class="t-en" x="916" y="426">Eye-Level / Two-Point Perspective</text>
  <rect x="916" y="438" width="238" height="84" fill="#f1f5f9" rx="6" />
  <rect x="992" y="458" width="110" height="54" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2" />
  <line x1="932" y1="512" x2="1140" y2="512" stroke="#64748b" stroke-width="1.5" />
  <circle cx="956" cy="488" r="5" fill="#0f766e" />
  <line x1="956" y1="493" x2="956" y2="512" stroke="#0f766e" stroke-width="2" />
  <text class="t-sub" x="916" y="544">• 보행자 시선(1.6m) + 수직선 수직 보정</text>
  <text class="t-sub" x="916" y="562">• 입구 인지성 · 마감 질감 · 사람 스케일</text>
  <text class="t-sub" x="916" y="580">• 날씨·골든아워 조명 분위기 비교에 최적</text>
</svg>