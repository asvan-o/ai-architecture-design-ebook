<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="handoff-title handoff-desc">
  <title id="handoff-title">제2-2차시 진행 구조 · 플랜·검수자 ChatGPT ↔ 사람 전달 ↔ 개발·구현자 Codex 6.1 Sol</title>
  <desc id="handoff-desc">두 AI에 먼저 역할을 부여한 뒤 ChatGPT와 Q1~Q3 문답으로 구현 지시문을 만들고, Codex가 생성한 HTML·MD 완료보고 파일을 ChatGPT에 직접 첨부해 최종 검수를 받는 흐름도</desc>
  <defs>
    <style>
      .bg { fill: #f8faf9; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; rx: 14; }
      .hdr-gpt { fill: #1e3a5f; }
      .hdr-human { fill: #0f766e; }
      .hdr-codex { fill: #173f39; }
      .card-gpt { fill: #f0f6fc; stroke: #bdd3ea; stroke-width: 1.2; rx: 8; }
      .card-human { fill: #ecfdf5; stroke: #99f6e4; stroke-width: 1.2; rx: 8; }
      .card-codex { fill: #f2f7f5; stroke: #bfd4ce; stroke-width: 1.2; rx: 8; }
      .warn-pill { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.3; rx: 8; }
      .step-bar { fill: #0f172a; rx: 10; }
      .t-main { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 19.5px; font-weight: 800; fill: #0f172a; }
      .t-sub { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 12.8px; fill: #475569; }
      .t-hdr { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 800; fill: #ffffff; }
      .t-tag { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: 700; fill: #dbeafe; }
      .t-title { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 800; fill: #0f172a; }
      .t-body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 11.8px; fill: #334155; }
      .t-warn { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 11.8px; font-weight: 800; fill: #c2410c; }
      .t-step { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 12.2px; font-weight: 700; fill: #f8fafc; }
      .arrow-r { stroke: #0f766e; stroke-width: 2.5; fill: none; marker-end: url(#m-green); }
      .arrow-l { stroke: #ea580c; stroke-width: 2.5; fill: none; marker-end: url(#m-orange); }
    </style>
    <marker id="m-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#0f766e" />
    </marker>
    <marker id="m-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#ea580c" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="540" rx="16" />
  <text class="t-main" x="30" y="38">제2-2차시 진행 순서 · 플랜·검수자(ChatGPT) ↔ 사람(전달) ↔ 개발·구현자(Codex 6.1 Sol)</text>
  <text class="t-sub" x="30" y="60">두 AI에 역할과 완료 보고 규칙을 먼저 지정한 뒤, 문답·지시문 전달·산출 파일(.html, .md) 직접 첨부로 검수를 마칩니다.</text>

  <!-- LEFT: ChatGPT -->
  <rect class="panel" x="26" y="78" width="356" height="368" rx="14" />
  <rect class="hdr-gpt" x="26" y="78" width="356" height="52" rx="14" />
  <rect class="hdr-gpt" x="26" y="110" width="356" height="20" />
  <text class="t-tag" x="44" y="98">ROLE 1 · 코드 작성 금지 · 기획 &amp; 최종 검수</text>
  <text class="t-hdr" x="44" y="120">플랜 수립자 · 검수자 ChatGPT</text>

  <rect class="warn-pill" x="42" y="142" width="324" height="54" rx="8" />
  <text class="t-warn" x="54" y="162">⚠ PC 내부 폴더 직접 읽기 불가 → 파일 첨부 필수</text>
  <text class="t-body" x="54" y="182">코덱스 산출물(.html, .md 등)을 [+]로 직접 올려 줍니다.</text>

  <rect class="card-gpt" x="42" y="206" width="324" height="112" rx="8" />
  <text class="t-title" x="54" y="227">① 역할 세팅 &amp; Q1~Q3 문답 후 [구현 지시문] 작성</text>
  <text class="t-body" x="54" y="247">• Q1 기존 양식 유무 → 신규 양식 설계</text>
  <text class="t-body" x="54" y="264">• Q2 출력 방식 → 편집 가능한 Word 파일</text>
  <text class="t-body" x="54" y="281">• Q3 책임기술자 수 → 공사마다 여러 명 가능</text>
  <text class="t-body" x="54" y="299">• 한글금액·빈칸금지·페이지분리 반영 [구현 지시문] 생성</text>

  <rect class="card-gpt" x="42" y="328" width="324" height="104" rx="8" />
  <text class="t-title" x="54" y="349">④ 첨부된 산출물(.html·.md) &amp; 완료 보고 검수</text>
  <text class="t-body" x="54" y="369">• 코덱스의 완료 보고 + 실제 .html 코드 정밀 대조</text>
  <text class="t-body" x="54" y="386">• 문제 발견 시 [수정 지시문] 작성 / 이상 없으면</text>
  <text class="t-body" x="54" y="403">  최종 검수 통과 판정 → 실습 완성!</text>

  <!-- CENTER: Human -->
  <rect class="panel" x="422" y="78" width="356" height="368" rx="14" />
  <rect class="hdr-human" x="422" y="78" width="356" height="52" rx="14" />
  <rect class="hdr-human" x="422" y="110" width="356" height="20" />
  <text class="t-tag" x="440" y="98">ROLE 2 · 사전 질문 답변 &amp; 파일·보고서 전달</text>
  <text class="t-hdr" x="440" y="120">사람 · 수강생 (오너 &amp; 메신저)</text>

  <rect class="card-human" x="438" y="146" width="324" height="86" rx="8" />
  <text class="t-title" x="450" y="168">Step 0~2 · 질문 3개 답하고 지시문 복붙하기</text>
  <text class="t-body" x="450" y="188">양식 유무·Word 출력·기술자 인원수 질문에만 답한 뒤</text>
  <text class="t-body" x="450" y="206">ChatGPT가 짜 준 [구현 지시문]을 Codex에 복사 전달</text>

  <rect class="card-human" x="438" y="244" width="324" height="92" rx="8" />
  <text class="t-title" x="450" y="266">Step 4 · 완료 보고 복붙 + 결과 파일 첨부(+)</text>
  <text class="t-body" x="450" y="286">탐색기 폴더에 생성된 .html, .md 등 산출 파일을</text>
  <text class="t-body" x="450" y="304">마우스로 끌어 ChatGPT에 첨부 + 완료보고 붙여넣기</text>
  <text class="t-body" x="450" y="321">(단일 폴더 산출물이라 누구나 즉시 첨부 가능)</text>

  <rect class="card-human" x="438" y="348" width="324" height="84" rx="8" />
  <text class="t-title" x="450" y="370">최종 확인 · 브라우저 실행 &amp; Word 2쪽 출력</text>
  <text class="t-body" x="450" y="390">더블클릭으로 열어 다수 기술자 추가·한글금액 확인 후</text>
  <text class="t-body" x="450" y="408">편집 가능한 Word 파일 및 A4 2쪽 페이지 분리 확인</text>

  <!-- RIGHT: Codex -->
  <rect class="panel" x="818" y="78" width="356" height="368" rx="14" />
  <rect class="hdr-codex" x="818" y="78" width="356" height="52" rx="14" />
  <rect class="hdr-codex" x="818" y="110" width="356" height="20" />
  <text class="t-tag" x="836" y="98">ROLE 3 · 지시문 기반 구현 &amp; 작업 완료 보고</text>
  <text class="t-hdr" x="836" y="120">개발·구현자 · Codex (6.1 Sol 모델)</text>

  <rect class="card-codex" x="834" y="146" width="324" height="86" rx="8" />
  <text class="t-title" x="846" y="168">Step 0 · 역할 지정 후 지시문 대기</text>
  <text class="t-body" x="846" y="188">“지시문 전달 전에는 파일을 만들지 마. 구현 후에는</text>
  <text class="t-body" x="846" y="206">ChatGPT에 전달할 [작업 완료 보고]를 정리해 줘.”</text>

  <rect class="card-codex" x="834" y="244" width="324" height="92" rx="8" />
  <text class="t-title" x="846" y="266">② 구현 실행 &amp; 산출물(.html·.md) 생성</text>
  <text class="t-body" x="846" y="286">• 무설치 단일 .html 도구 + 완료 보고 문서 생성</text>
  <text class="t-body" x="846" y="304">• 다수 책임기술자 추가·Word 저장·2쪽 분리 구현</text>
  <text class="t-body" x="846" y="321">• 생성 파일명·기능·확인사항 [작업 완료 보고] 출력</text>

  <rect class="card-codex" x="834" y="348" width="324" height="84" rx="8" />
  <text class="t-title" x="846" y="370">필요 시 수정 반영 (동일 보고 양식 유지)</text>
  <text class="t-body" x="846" y="390">• ChatGPT 검수에서 보완 지시가 있을 때만</text>
  <text class="t-body" x="846" y="408">  [수정 지시문]을 붙여 넣어 즉시 보완 완료</text>

  <line class="arrow-r" x1="384" y1="190" x2="418" y2="190" />
  <line class="arrow-r" x1="780" y1="190" x2="814" y2="190" />
  <line class="arrow-l" x1="814" y1="292" x2="780" y2="292" />
  <line class="arrow-l" x1="418" y1="292" x2="384" y2="292" />

  <rect class="step-bar" x="26" y="464" width="1148" height="52" rx="10" />
  <text class="t-step" x="46" y="495">전체 흐름: ① 두 AI 역할 지정 → ② ChatGPT 주제·Q1~Q3 답변 후 [구현 지시문] 확보 → ③ Codex 구현·완료보고 → ④ 파일(.html·.md) 첨부 검수 완료</text>
</svg>
