<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="roadmap-title roadmap-desc">
  <title id="roadmap-title">제1차시 7가지 규칙으로 시작하는 코덱스 바이브코딩 단계별 진행 로드맵</title>
  <desc id="roadmap-desc">제1차시에서 배운 7가지 프롬프트 규칙을 활용해 코덱스에게 Step 0 계획·구조 제안을 먼저 받은 뒤, 같은 대화창에서 Step 1부터 Step 4까지 검토 기준을 확인하며 완성하는 흐름도</desc>
  <defs>
    <style>
      .bg { fill: #f8faf9; }
      .frame { fill: #ffffff; stroke: #cbd8d5; stroke-width: 1.5; rx: 14; }
      .hdr-1 { fill: #173f39; }
      .hdr-2 { fill: #1d4e68; }
      .hdr-3 { fill: #3b4b59; }
      .card { fill: #f3f7f6; stroke: #c5d6d2; stroke-width: 1.2; rx: 8; }
      .card-blue { fill: #f1f6fa; stroke: #bfd3e2; stroke-width: 1.2; rx: 8; }
      .card-step { fill: #ffffff; stroke: #b8c9c5; stroke-width: 1.2; rx: 8; }
      .badge-ok { fill: #e6f4f1; stroke: #0f766e; stroke-width: 1; rx: 6; }
      .title-main { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 20px; font-weight: 800; fill: #0f2925; }
      .sub-main { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 13px; fill: #485b57; }
      .col-title { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 800; fill: #ffffff; }
      .item-title { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 13.5px; font-weight: 800; fill: #12312c; }
      .item-body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 12px; fill: #334155; }
      .check-text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f766e; }
      .arrow { stroke: #173f39; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
      .arrow-down { stroke: #1d4e68; stroke-width: 2; fill: none; marker-end: url(#arrowhead-blue); }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#173f39" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1d4e68" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="520" rx="16" />
  <text class="title-main" x="32" y="38">코덱스 바이브코딩 전체 진행도 · 제1차시 ‘7가지 규칙’으로 시작해 Step 1~4로 완성하기</text>
  <text class="sub-main" x="32" y="60">빈 채팅창에 곧바로 코드를 짜 달라고 하지 않고, 7가지 규칙으로 ① 계획·구조(Step 0)를 먼저 합의한 뒤 ② 같은 대화창에서 기능을 한 단계씩 덧붙입니다.</text>

  <!-- COLUMN 1: 7 Rules -->
  <rect class="frame" x="28" y="78" width="336" height="416" rx="14" />
  <rect class="hdr-1" x="28" y="78" width="336" height="44" rx="14" />
  <rect class="hdr-1" x="28" y="104" width="336" height="18" />
  <text class="col-title" x="46" y="106">1. 시작점 준비 · 제1차시 7가지 규칙 선택</text>

  <rect class="card" x="44" y="136" width="304" height="72" rx="8" />
  <text class="item-title" x="56" y="158">규칙 1·2 · 작업 목적과 맥락(의도)</text>
  <text class="item-body" x="56" y="177">반복 작성하는 착수계 4종을 1회 입력으로 동기화해</text>
  <text class="item-body" x="56" y="195">수작업 오타를 없애고 실행 크레딧 0원으로 사용</text>

  <rect class="card" x="44" y="218" width="304" height="64" rx="8" />
  <text class="item-title" x="56" y="240">규칙 3 · 입력자료의 이름·역할</text>
  <text class="item-body" x="56" y="259">용역명·금액·기간·기술자 명단 JSON 및 화면 입력값</text>
  <text class="item-body" x="56" y="274">(외부에서 가져온 JSON 원본은 읽기 전용 보존)</text>

  <rect class="card" x="44" y="292" width="304" height="78" rx="8" />
  <text class="item-title" x="56" y="314">규칙 5 · 조건과 제한 (안전 경계)</text>
  <text class="item-body" x="56" y="333">• 외부 유료 API 금지 (순수 Node.js · HTML만 사용)</text>
  <text class="item-body" x="56" y="350">• 자격번호·변경사유 누락 시 임의 생성 절대 금지</text>
  <text class="item-body" x="56" y="365">• 기존 저장 파일 덮어쓰기 금지 (_v02 버전 보존)</text>

  <rect class="card" x="44" y="380" width="304" height="98" rx="8" />
  <text class="item-title" x="56" y="402">규칙 4·6·7 · 단계 분할 · 결과 형식 · 검토 기준</text>
  <text class="item-body" x="56" y="421">• 첫 대화(Step 0): 코드 대신 구조·계획표 형식으로 요청</text>
  <text class="item-body" x="56" y="439">• 본 구현(Step 1~4): 한 번에 1단계씩 실행 파일 요청</text>
  <text class="item-body" x="56" y="457">• 매 단계 직후 사람이 샘플 숫자로 통과 여부 판정</text>

  <!-- Arrow Col 1 -> Col 2 -->
  <line class="arrow" x1="366" y1="286" x2="398" y2="286" />

  <!-- COLUMN 2: Step 0 Plan & Structure -->
  <rect class="frame" x="404" y="78" width="332" height="416" rx="14" />
  <rect class="hdr-2" x="404" y="78" width="332" height="44" rx="14" />
  <rect class="hdr-2" x="404" y="104" width="332" height="18" />
  <text class="col-title" x="422" y="106">2. Step 0 첫 대화 · 계획·구조(설계) 합의</text>

  <rect class="card-blue" x="420" y="138" width="300" height="96" rx="8" />
  <text class="item-title" x="432" y="160">① 사람의 첫 마디 (코드 작성 전 기획 요청)</text>
  <text class="item-body" x="432" y="180">“빈 실습 폴더 연결했어. 아직 코드는 짜지 말고,</text>
  <text class="item-body" x="432" y="198">위 목적·제한 조건에 맞춰 역할 구조(Architecture),</text>
  <text class="item-body" x="432" y="216">폴더·파일 배치(Hierarchy), 4단계 계획을 표로 줘.”</text>

  <line class="arrow-down" x1="570" y1="236" x2="570" y2="256" />

  <rect class="card-blue" x="420" y="260" width="300" height="94" rx="8" />
  <text class="item-title" x="432" y="282">② 코덱스의 설계도 응답</text>
  <text class="item-body" x="432" y="302">• 계산(calculator) → 검수(validator) → 서식(templates)</text>
  <text class="item-body" x="432" y="320">  → 저장(server) → 화면(ui) 역할 분리안 제시</text>
  <text class="item-body" x="432" y="338">• app / samples / projects / output 폴더 트리 제안</text>

  <line class="arrow-down" x1="570" y1="356" x2="570" y2="376" />

  <rect class="badge-ok" x="420" y="380" width="300" height="98" rx="8" />
  <text class="item-title" x="432" y="403">③ 사람의 설계 검수 및 출발 신호</text>
  <text class="item-body" x="432" y="423">✓ 빈칸을 추측해 채우는 위험한 단계가 없는가?</text>
  <text class="item-body" x="432" y="441">✓ 계산과 서식 파일이 깔끔히 분리되었는가?</text>
  <text class="check-text" x="432" y="463">→ “좋아, 이 구조로 확정! Step 1부터 구현해 줘.”</text>

  <!-- Arrow Col 2 -> Col 3 -->
  <line class="arrow" x1="738" y1="286" x2="770" y2="286" />

  <!-- COLUMN 3: Step 1 ~ 4 Iterative Commands -->
  <rect class="frame" x="776" y="78" width="396" height="416" rx="14" />
  <rect class="hdr-3" x="776" y="78" width="396" height="44" rx="14" />
  <rect class="hdr-3" x="776" y="104" width="396" height="18" />
  <text class="col-title" x="794" y="106">3. 같은 대화창에서 Step 1~4 단계별 명령 · 검증</text>

  <rect class="card-step" x="792" y="134" width="364" height="78" rx="8" />
  <text class="item-title" x="804" y="155">Step 1 지시 · 폴더 구조 + 금액·일수 계산기</text>
  <text class="item-body" x="804" y="173">생성: START/STOP.bat · app/calculator.js</text>
  <text class="check-text" x="804" y="194">[검토 기준] 3,850만원(“삼천팔백오십만원정”)·90일 일치 확인 → 다음!</text>

  <rect class="card-step" x="792" y="220" width="364" height="78" rx="8" />
  <text class="item-title" x="804" y="241">Step 2 지시 · 자동 조립 vs 사람 확인(검수 대기) 분기</text>
  <text class="item-body" x="804" y="259">생성: app/validator.js (필수값·자격번호·날짜역전 검사)</text>
  <text class="check-text" x="804" y="280">[검토 기준] 누락·날짜역전 시 임의 생성 없이 경고 분기 확인 → 다음!</text>

  <rect class="card-step" x="792" y="306" width="364" height="78" rx="8" />
  <text class="item-title" x="804" y="327">Step 3 지시 · 4종 서식 페이지 분리 조립 + _v02 보존</text>
  <text class="item-body" x="804" y="345">생성: app/templates.js · app/server.js · output/</text>
  <text class="check-text" x="804" y="366">[검토 기준] 서류별 새 페이지 분리 · 중복 안내 · _v02 생성 확인 → 다음!</text>

  <rect class="card-step" x="792" y="392" width="364" height="86" rx="8" />
  <text class="item-title" x="804" y="413">Step 4 지시 · 4175 브라우저 화면 + PDF/Word 출력 완성</text>
  <text class="item-body" x="804" y="431">생성: app/ui/index.html · app.js · style.css · README.txt</text>
  <text class="check-text" x="804" y="452">[검토 기준] DOC_TEST 6종 대조 · A4 PDF/Word 페이지 분리 최종 통과!</text>
  <text class="item-body" x="804" y="469">(오류 발견 시 전체 재작성 대신 해당 파일 1개만 집어 수정 지시)</text>
</svg>
