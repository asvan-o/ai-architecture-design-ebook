name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The immutable approval commit is required by validate:courses.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Validate content
        run: npm run validate:content
      - name: Validate course profiles and protected baseline
        run: npm run validate:courses
      - name: Test course and asset integrity
        run: npm test
      - name: Build public courses and reuse approved PDFs
        run: npm run build:student-with-pdf
      - name: Prepare Pages and verify immutable Release mapping
        run: npm run prepare:pages
      - name: Verify published Release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-upload.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
