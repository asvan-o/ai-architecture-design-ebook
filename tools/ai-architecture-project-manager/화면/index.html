<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>캠퍼스 라운지 프로젝트 관리</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <p>제4차시 · 로컬 작업공간</p>
        <h1>캠퍼스 라운지 프로젝트 관리</h1>
      </div>
      <label>
        차시
        <select id="lesson-select" aria-label="등록 차시">
          <option value="3">제3차시</option>
          <option value="4" selected>제4차시</option>
        </select>
      </label>
    </header>

    <main>
      <section class="notice" aria-labelledby="notice-title">
        <h2 id="notice-title">프로그램의 역할</h2>
        <p>
          이 프로그램은 파일 복사, 이름·버전 정리, 같은 파일 알림과 작업 ZIP 생성을
          돕습니다. 설계 품질, 법규 적합성 또는 실제 시공 가능성을 판정하지 않습니다.
        </p>
      </section>

      <section aria-labelledby="areas-title">
        <div class="section-title">
          <div>
            <p>자료 분류</p>
            <h2 id="areas-title">6개 관리 영역</h2>
          </div>
          <button id="refresh-button" type="button">목록 새로고침</button>
        </div>
        <div id="area-grid" class="area-grid" aria-live="polite"></div>
      </section>

      <section class="validation-panel" aria-labelledby="validation-title">
        <div>
          <p>제출 준비</p>
          <h2 id="validation-title">제출 전 확인과 작업 ZIP</h2>
        </div>
        <div class="validation-actions">
          <button id="missing-button" type="button">제출 전 확인</button>
          <button id="zip-button" type="button" disabled>검토한 등록 파일로 ZIP 만들기</button>
        </div>
        <div id="validation-result" tabindex="-1"></div>
        <div class="delivery-preview" aria-labelledby="delivery-preview-title">
          <h3 id="delivery-preview-title">ZIP 포함 예정 파일</h3>
          <p id="delivery-summary"></p>
          <ul id="delivery-file-list"></ul>
          <label class="review-confirmation">
            <input id="delivery-review" type="checkbox" />
            포함 목록과 누락 항목을 직접 확인했습니다.
          </label>
        </div>
      </section>

      <section aria-labelledby="files-title">
        <div class="section-title">
          <div>
              <p>등록 자료</p>
            <h2 id="files-title">등록 파일 목록</h2>
          </div>
        </div>
        <div class="table-scroll" tabindex="0" role="region" aria-label="등록 파일 목록">
          <table>
            <thead>
              <tr><th>차시</th><th>영역</th><th>유형</th><th>파일명</th><th>버전</th></tr>
            </thead>
            <tbody id="file-list"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="message" class="message" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
