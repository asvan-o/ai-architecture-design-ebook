<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="l9t l9d">
  <title id="l9t">제9차시 프로젝트 reference 폴더 그라운딩 구조와 층별 3D 모델링 흐름</title>
  <desc id="l9d">프로젝트 폴더 안의 reference 하위 4개 폴더(01_도면, 02_문서, 03_공간관계, 04_디자인)를 Codex에 연결해 1층 모델링과 디벨롭, 2층, 3층, 실내외 마감으로 이어지는 흐름도</desc>
  <defs>
    <marker id="l9arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a8a"/>
    </marker>
    <marker id="l9arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1200" height="470" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="28" y="20" width="1144" height="54" rx="12" fill="#1e3a8a"/>
  <text x="52" y="53" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" font-weight="800" fill="#ffffff">왕초보 실전 방식 · 프로젝트 폴더에 reference 4칸만 정리하면 3D 모델링이 쉬워집니다</text>

  <!-- Left: Project Folder Box -->
  <rect x="28" y="94" width="440" height="352" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="28" y="94" width="440" height="44" rx="14" fill="#eff6ff"/>
  <rect x="28" y="124" width="440" height="14" fill="#eff6ff"/>
  <text x="48" y="122" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15.5" font-weight="800" fill="#1e3a8a">내 PC 프로젝트 폴더: C:\work\my-house-3f\reference\</text>

  <!-- Folder 1 -->
  <rect x="46" y="152" width="404" height="62" rx="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.6"/>
  <rect x="58" y="164" width="96" height="24" rx="6" fill="#dbeafe"/>
  <text x="106" y="180" text-anchor="middle" font-family="Consolas, 'Malgun Gothic', sans-serif" font-size="13" font-weight="800" fill="#1e3a8a">01_도면\</text>
  <text x="166" y="180" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14.5" font-weight="800" fill="#0f172a">선화 정리된 CAD 도면 (DXF · PNG)</text>
  <text x="58" y="204" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12.5" fill="#475569">1·2·3층 평면도, 단면도, 입면도 6장 넣기 (벽·문·창·가구 배치 기준)</text>

  <!-- Folder 2 -->
  <rect x="46" y="224" width="404" height="62" rx="10" fill="#f8fafc" stroke="#0f766e" stroke-width="1.6"/>
  <rect x="58" y="236" width="96" height="24" rx="6" fill="#ccfbf1"/>
  <text x="106" y="252" text-anchor="middle" font-family="Consolas, 'Malgun Gothic', sans-serif" font-size="13" font-weight="800" fill="#0f766e">02_문서\</text>
  <text x="166" y="252" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14.5" font-weight="800" fill="#0f172a">NotebookLM 통합 분석표 (1개)</text>
  <text x="58" y="276" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12.5" fill="#475569">층별 치수·방 이름·기능·실제 문 연결·계단 동선을 표 1개로 저장</text>

  <!-- Folder 3 -->
  <rect x="46" y="296" width="404" height="62" rx="10" fill="#f8fafc" stroke="#0f766e" stroke-width="1.6"/>
  <rect x="58" y="308" width="96" height="24" rx="6" fill="#ccfbf1"/>
  <text x="106" y="324" text-anchor="middle" font-family="Consolas, 'Malgun Gothic', sans-serif" font-size="13" font-weight="800" fill="#0f766e">03_공간관계\</text>
  <text x="166" y="324" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14.5" font-weight="800" fill="#0f172a">방·문 연결 관계도 (PNG · 메모)</text>
  <text x="58" y="348" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12.5" fill="#475569">ChatGPT·NotebookLM으로 바로 그린 화살표 관계도 (DOT는 선택)</text>

  <!-- Folder 4 -->
  <rect x="46" y="368" width="404" height="62" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <rect x="58" y="380" width="96" height="24" rx="6" fill="#fef3c7"/>
  <text x="106" y="396" text-anchor="middle" font-family="Consolas, 'Malgun Gothic', sans-serif" font-size="13" font-weight="800" fill="#92400e">04_디자인\</text>
  <text x="166" y="396" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14.5" font-weight="800" fill="#0f172a">참고 사진(JPG/PNG) + 컨셉 메모장</text>
  <text x="58" y="420" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12.5" fill="#78350f">원하는 인테리어·외장 사진이나 아래 5대 컨셉 문장을 메모장에 저장</text>

  <!-- Arrow Left -> Center -->
  <line x1="472" y1="270" x2="516" y2="270" stroke="#1e3a8a" stroke-width="3" marker-end="url(#l9arr)"/>

  <!-- Center: Codex + Blender MCP Engine -->
  <rect x="524" y="148" width="212" height="244" rx="16" fill="#1e3a8a"/>
  <text x="630" y="186" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700" fill="#93c5fd">Codex에서 이 폴더 열기</text>
  <text x="630" y="218" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" font-weight="800" fill="#ffffff">Codex + MCP</text>
  <rect x="544" y="238" width="172" height="72" rx="10" fill="#ffffff"/>
  <text x="630" y="264" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">“reference 폴더를</text>
  <text x="630" y="284" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">전부 읽고 시작해 줘”</text>
  <text x="630" y="302" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11.5" fill="#0f766e">긴 좌표 입력 불필요!</text>
  <text x="630" y="344" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" font-weight="700" fill="#dbeafe">↓ Blender 실시간 제어</text>
  <text x="630" y="368" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12.5" fill="#93c5fd">(N키 → Start MCP Server)</text>

  <!-- Arrow Center -> Right -->
  <line x1="740" y1="270" x2="784" y2="270" stroke="#0f766e" stroke-width="3" marker-end="url(#l9arr-teal)"/>

  <!-- Right: 4 Linear Modeling Steps -->
  <rect x="792" y="94" width="380" height="352" rx="14" fill="#ffffff" stroke="#5eead4" stroke-width="2"/>
  <rect x="792" y="94" width="380" height="44" rx="14" fill="#f0fdfa"/>
  <rect x="792" y="124" width="380" height="14" fill="#f0fdfa"/>
  <text x="814" y="122" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15.5" font-weight="800" fill="#0f766e">Part 2~3 · 층별로 쉽게 쌓고 디벨롭하기</text>

  <!-- R1 -->
  <rect x="812" y="152" width="340" height="60" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="828" y="176" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14.5" font-weight="800" fill="#0f172a">① 1층 만들기 + 바로 디벨롭</text>
  <text x="828" y="198" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12.5" fill="#334155">바닥·벽 → 문/창 뚫기 → 가구 배치 → 색감·조명 수정</text>

  <!-- R2 -->
  <rect x="812" y="224" width="340" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="828" y="248" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14.5" font-weight="800" fill="#0f172a">② 2층 올리기 (침실 · 욕실 · 발코니)</text>
  <text x="828" y="270" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12.5" fill="#334155">1층 그대로 유지 + 계단 구멍 뚫고 2층 도면대로 적층</text>

  <!-- R3 -->
  <rect x="812" y="296" width="340" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="828" y="320" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14.5" font-weight="800" fill="#0f172a">③ 3층 라운지 · 옥상 테라스 완성</text>
  <text x="828" y="342" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12.5" fill="#334155">3층 실내·야외 데크·유리 난간·지붕까지 구조 마무리</text>

  <!-- R4 -->
  <rect x="812" y="368" width="340" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="828" y="393" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14.5" font-weight="800" fill="#1e3a8a">④ 실내 재질·조명 &amp; 익스테리어 8선 입히기</text>
  <text x="828" y="415" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12.5" fill="#1e3a8a">유명 외장 디자인 8종 참고 이미지로 외관 마감 → 카메라 투어</text>
</svg>
