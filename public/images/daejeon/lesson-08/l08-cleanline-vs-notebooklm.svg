<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-labelledby="t2 d2">
  <title id="t2">왜 클린 선화(그림)와 NotebookLM 분석표(원본 PDF)를 짝지어 쓸까?</title>
  <desc id="d2">클린 선화 이미지 단독 사용 시 글자 깨짐 한계와 텍스트 단독 사용 시 공간 감각 한계를 두 트랙 결합으로 해결하는 로직 도해</desc>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a8a"/>
    </marker>
  </defs>

  <rect width="1200" height="410" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="46" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" font-weight="800" fill="#0f172a">왜 ‘원본 PDF 분석표(NotebookLM)’와 ‘클린 선화(그림)’ 2가지를 같이 만드나요?</text>
  <text x="36" y="72" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14" fill="#475569">하나만 쓰면 꼭 구멍이 생깁니다. 글자·사실은 원본 PDF로, 벽·문 모양은 클린 선화로 역할을 나누면 완벽한 기초자료가 됩니다.</text>

  <!-- Source box -->
  <rect x="34" y="114" width="210" height="240" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="34" y="114" width="210" height="42" rx="14" fill="#e2e8f0"/>
  <rect x="34" y="142" width="210" height="14" fill="#e2e8f0"/>
  <text x="139" y="140" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15" font-weight="800" fill="#0f172a">출발 · 원본 평면도</text>
  <text x="139" y="188" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="800" fill="#1e293b">복잡한 1층 오피스</text>
  <text x="139" y="212" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14" fill="#475569">PDF + PNG 원본</text>
  <rect x="52" y="232" width="174" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="139" y="256" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#334155">• 치수선·축선 겹침</text>
  <text x="139" y="278" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#334155">• 마감표·단면 기호 복잡</text>
  <text x="139" y="300" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">✓ 대신 모든 정답이</text>
  <text x="139" y="320" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">   그대로 살아 있음</text>

  <!-- Split arrows -->
  <path d="M 246 196 C 282 196, 278 164, 314 164" fill="none" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr2)"/>
  <path d="M 246 276 C 282 276, 278 304, 314 304" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- Track A: NotebookLM -->
  <rect x="322" y="102" width="468" height="122" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="338" y="116" width="132" height="28" rx="14" fill="#dbeafe"/>
  <text x="404" y="135" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" font-weight="800" fill="#1e3a8a">트랙 A · 사실 추출</text>
  <text x="484" y="136" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="800" fill="#0f172a">NotebookLM → 원본 분석표(기준표)</text>
  <text x="342" y="166" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13.5" fill="#1e293b">✓ 강점: 글자가 살아 있는 PDF만 읽고 출처 번호([1],[2])로 근거 제시</text>
  <text x="342" y="190" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13.5" fill="#1e293b">✓ 결과: 방 이름(모형실·소장실), 확정 문(KEEP), 보류(REVIEW) 정확히 확보</text>
  <text x="342" y="212" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12.5" fill="#b91c1c">! 단독 한계: 글로 된 표만으로는 벽의 시각적 배치를 바로 쓰기 어려움</text>

  <!-- Track B: Clean Line -->
  <rect x="322" y="242" width="468" height="122" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="338" y="256" width="132" height="28" rx="14" fill="#ccfbf1"/>
  <text x="404" y="275" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" font-weight="800" fill="#0f766e">트랙 B · 시각 정리</text>
  <text x="484" y="276" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="800" fill="#0f172a">이미지 AI / CAD → 클린 선화(Clean Line)</text>
  <text x="342" y="306" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13.5" fill="#1e293b">✓ 강점: 복잡한 치수선·마감표를 걷어내 벽·문·창 구조가 시원하게 보임</text>
  <text x="342" y="330" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13.5" fill="#1e293b">✓ 결과: 다음 단계(동선 검토 · 3D 참고)에 넣기 좋은 깔끔한 흑백 도면</text>
  <text x="342" y="352" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12.5" fill="#b91c1c">! 단독 한계: 이미지 생성 중 글자 오타(모형실→이사실)가 섞일 수 있음</text>

  <!-- Merge arrows -->
  <path d="M 792 164 C 828 164, 824 218, 862 218" fill="none" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr2)"/>
  <path d="M 792 304 C 828 304, 824 252, 862 252" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- Merged Output -->
  <rect x="870" y="132" width="296" height="206" rx="16" fill="#1e3a8a"/>
  <text x="1018" y="168" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700" fill="#93c5fd">두 트랙 결합 = 실수 없는 기초자료</text>
  <text x="1018" y="200" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="19" font-weight="800" fill="#ffffff">정답 기준표 + 클린 선화</text>
  <rect x="892" y="220" width="252" height="96" rx="10" fill="#ffffff"/>
  <text x="1018" y="246" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">• 그림의 오타는 기준표로 교정</text>
  <text x="1018" y="272" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">• 벽·문 모양은 선화로 한눈에</text>
  <text x="1018" y="298" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13.5" font-weight="800" fill="#0f766e">→ 3·4단계 관계도 · 5단계 3D 투입!</text>
</svg>
