<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="t d"><title id="t">Codex와 Blender MCP 첫 룸 실습</title><desc id="d">Codex 채팅, MCP 서버, Blender 애드온을 연결하고 세 벽과 창이 있는 룸을 생성하는 구성 안내</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#235b68"/></marker></defs><rect width="1080" height="540" fill="#f6f5f0"/><g font-family="sans-serif" fill="#172f38"><text x="36" y="45" font-size="25" font-weight="700">첫 MCP 연결 → 3D 룸 생성 → 실제 치수 확인</text><g fill="#fff" stroke="#b3c5c8"><rect x="36" y="75" width="280" height="105" rx="8"/><rect x="400" y="75" width="280" height="105" rx="8"/><rect x="764" y="75" width="280" height="105" rx="8"/></g><g font-size="20" font-weight="700"><text x="57" y="110">Codex 채팅창</text><text x="420" y="110">로컬 MCP 서버</text><text x="784" y="110">Blender 애드온</text></g><g font-size="16"><text x="57" y="143">목표·치수·검토 기준 입력</text><text x="420" y="143">uvx · STDIO ↔ TCP</text><text x="784" y="143">localhost:9876 · 씬 제어</text></g><g stroke="#235b68" stroke-width="3" marker-end="url(#a)"><path d="M325 125H390"/><path d="M689 125H754"/><path d="M905 190V225"/></g><g transform="translate(80,245)" stroke="#547d85" stroke-width="2"><path d="M0 180L350 180L410 110L60 110Z" fill="#ced9dc"/><path d="M0 180V30L60 0V110" fill="#dbe5e6"/><path d="M350 180V30L410 0V110" fill="#dbe5e6"/><path d="M60 110V0H410V110H300V45H170V110Z" fill="#eff4f4"/><path d="M170 110V45H300V110" fill="none" stroke="#235b68" stroke-dasharray="5 4"/><path d="M170 110H300" stroke-dasharray="5 4"/><path d="M170 110L300 45M170 45L300 110" opacity=".2"/><circle cx="175" cy="155" r="9" fill="#235b68"/><path d="M175 146L220 80" marker-end="url(#a)"/><g fill="#172f38" stroke="none" font-family="sans-serif" font-size="16"><text x="25" y="214">南 · 열린 진입부 / 카메라 Z=1.6m</text><text x="120" y="-15">北 · 중앙 관통 창 2.4 × 1.5m</text></g></g><g font-size="19"><text x="590" y="275" font-weight="700">실제 씬에서 확인할 것</text><text x="590" y="316">바닥 외곽 6 × 4m · 두께 0.2m</text><text x="590" y="353">북·서·동 벽 높이 2.8m</text><text x="590" y="390">창 하단 0.9m / 상단 2.4m</text><text x="590" y="427">24mm 아이레벨 카메라 + Sun Light</text></g><text x="36" y="508" font-size="15" fill="#566e75">교육용 구성 안내도 · 실제 Blender 실행 캡처가 아님 · 조회 → 생성 → 재조회 → 직접 저장</text></g></svg>
