<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="bridge-title bridge-desc">
  <title id="bridge-title">저크레딧 로컬 자동화 프로그램(Vibe Coding)과 MCP 연결의 역할 비교</title>
  <desc id="bridge-desc">반복 행정문서(착수계 등)처럼 규칙이 명확한 일은 바이브코딩으로 로컬 생성기를 만들어 실행 크레딧 0원으로 처리하고, Blender나 실시간 외부 도구 조작은 MCP로 연결하는 실무 구분 안내도</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <rect x="16" y="16" width="1168" height="488" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="16" y="16" width="1168" height="68" rx="14" fill="#f1f5f9"/>
    <rect x="16" y="68" width="1168" height="16" fill="#f1f5f9"/>
    <line x1="16" y1="84" x2="1184" y2="84" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="40" y="48" font-size="21" font-weight="800" fill="#0f172a">언제 ‘바이브코딩 프로그램’을 만들고, 언제 ‘MCP’를 연결할까?</text>
    <text x="40" y="72" font-size="13.5" font-weight="600" fill="#475569">크레딧 소모와 숫자 오류를 줄이려면 ‘규칙 반복 업무’와 ‘AI 실시간 도구 조작’을 처음부터 나누어 설계합니다.</text>

    <!-- Left Card: Vibe Coding Local Tool -->
    <g transform="translate(40, 106)">
      <rect width="540" height="334" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <rect width="540" height="44" rx="11" fill="#1e3a8a"/>
      <rect y="30" width="540" height="14" fill="#1e3a8a"/>
      <text x="20" y="28" font-size="16" font-weight="800" fill="#ffffff">방식 A · Vibe Coding 로컬 프로그램 제작 (오늘 제2차시)</text>

      <text x="20" y="72" font-size="15" font-weight="800" fill="#1e3a8a">“AI로 생성기를 딱 1번 만들고, 실행은 내 PC에서 무제한 무료”</text>
      <rect x="20" y="88" width="500" height="62" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="34" y="111" font-size="13" font-weight="700" fill="#0f172a">Codex 사용 시점: 제작·수정할 때만 (3~4회 요청)</text>
      <text x="34" y="134" font-size="13" font-weight="800" fill="#047857">완성 후 일상 실행 크레딧: 0원 (AI API 호출 없음 · 오프라인 동작)</text>

      <text x="20" y="176" font-size="13.5" font-weight="800" fill="#1e293b">잘 맞는 건축·행정 실무</text>
      <text x="20" y="198" font-size="12.5" fill="#334155">· 착수계 · 책임기술자 선임계 · 참여기술자 명단 · 보안각서 반복 작성</text>
      <text x="20" y="218" font-size="12.5" fill="#334155">· 설계변경·공기연장 시 날짜·과업일수·한글 금액(일금 ~원정) 일괄 갱신</text>
      <text x="20" y="238" font-size="12.5" fill="#334155">· 확장자·파일명 규칙 기반 프로젝트 산출물 정리 및 버전 보존(_v02)</text>

      <rect x="20" y="258" width="500" height="58" rx="8" fill="#dbeafe"/>
      <text x="34" y="280" font-size="12.5" font-weight="800" fill="#1e3a8a">실무 장점: 계산 공식이 코드로 고정되어 금액·일수 환각(오타) 0%</text>
      <text x="34" y="300" font-size="12" fill="#1e40af">계약금액·기술자 정보 등 사내 민감 자료가 외부 AI 서버로 전송되지 않음</text>
    </g>

    <!-- Right Card: MCP Tool Connection -->
    <g transform="translate(620, 106)">
      <rect width="540" height="334" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
      <rect width="540" height="44" rx="11" fill="#0f766e"/>
      <rect y="30" width="540" height="14" fill="#0f766e"/>
      <text x="20" y="28" font-size="16" font-weight="800" fill="#ffffff">방식 B · MCP(Model Context Protocol) 연결 (제8·9차시)</text>

      <text x="20" y="72" font-size="15" font-weight="800" fill="#0f766e">“AI가 외부 전문 소프트웨어를 실시간으로 읽고 직접 조작”</text>
      <rect x="20" y="88" width="500" height="62" rx="8" fill="#ffffff" stroke="#5eead4"/>
      <text x="34" y="111" font-size="13" font-weight="700" fill="#0f172a">AI 사용 시점: 작업할 때마다 현재 상태를 조회하고 명령 수행</text>
      <text x="34" y="134" font-size="13" font-weight="700" fill="#0f766e">연결 경로: Host(Codex 등) ↔ MCP Client ↔ MCP Server ↔ 실무 앱</text>

      <text x="20" y="176" font-size="13.5" font-weight="800" fill="#1e293b">잘 맞는 건축·설계 실무</text>
      <text x="20" y="198" font-size="12.5" fill="#334155">· Blender MCP로 검증된 기준표 기반 3D 공간·창호·카메라 직접 생성</text>
      <text x="20" y="218" font-size="12.5" fill="#334155">· 지정된 로컬 문서함에서 과업지시서·회의록 맥락을 찾아 비교·요약</text>
      <text x="20" y="238" font-size="12.5" fill="#334155">· Notion·브라우저·사내 DB와 연결해 프로젝트별 다른 조건 판단 보조</text>

      <rect x="20" y="258" width="500" height="58" rx="8" fill="#ccfbf1"/>
      <text x="34" y="280" font-size="12.5" font-weight="800" fill="#115e59">실무 장점: 매번 형태·맥락이 달라지는 3D 장면과 복합 문서를 유연하게 제어</text>
      <text x="34" y="300" font-size="12" fill="#0f766e">반드시 조회(Inspect) → 실행(Act) → 재확인(Verify) 순서로 사람이 통제</text>
    </g>

    <!-- Bottom Summary -->
    <rect x="40" y="454" width="1120" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="600" y="476" text-anchor="middle" font-size="13" font-weight="800" fill="#92400e">핵심 판단 기준:  양식·계산식이 정해진 반복 서류(착수계·변경계)는 [방식 A 로컬 생성기]로 크레딧 0원화!  외부 앱 실시간 조작은 [방식 B MCP]로 연결!</text>
  </g>
</svg>
