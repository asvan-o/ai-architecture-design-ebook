<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="lecture-kit-token" content="__LECTURE_KIT_TOKEN__" />
    <title>AI 건축디자인 강의 허브</title>
    <link rel="stylesheet" href="/hub/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    <header class="masthead">
      <p class="eyebrow">LOCAL LECTURE CONTROL</p>
      <h1>AI 건축디자인<br />강의 허브</h1>
      <p class="intro">학생 화면과 강사용 화면을 한곳에서 엽니다. 학생 공개 e-book은 이 허브의 조작으로 강제 이동하지 않습니다.</p>
    </header>

    <main id="main">
      <section class="status-panel" aria-labelledby="status-title">
        <div>
          <p class="section-label">SYSTEM STATUS</p>
          <h2 id="status-title">실행 상태</h2>
        </div>
        <button id="refresh-status" class="button button--quiet" type="button">상태 새로고침</button>
        <dl id="status-list" class="status-list" aria-live="polite"></dl>
      </section>

      <section class="launcher" aria-labelledby="launcher-title">
        <div class="launcher-heading">
          <div>
            <p class="section-label">OPEN A VIEW</p>
            <h2 id="launcher-title">차시 화면 열기</h2>
          </div>
          <label>
            <span>차시 선택</span>
            <select id="lesson-select">
              <option value="01">제1차시</option>
              <option value="02">제2차시</option>
              <option value="03">제3차시</option>
              <option value="04">제4차시</option>
              <option value="05">제5차시</option>
              <option value="06">제6차시</option>
              <option value="07">제7차시</option>
              <option value="08">제8차시</option>
              <option value="09">제9차시</option>
              <option value="10">제10차시</option>
              <option value="11">제11차시</option>
              <option value="12">제12차시</option>
              <option value="13">제13차시</option>
              <option value="14">제14차시</option>
            </select>
          </label>
        </div>

        <div class="action-grid">
          <button type="button" data-open="student">학생 e-book</button>
          <button type="button" data-open="console">강사용 콘솔</button>
          <button type="button" data-open="presentation">프로젝터 화면</button>
          <button type="button" data-open="student-presentation">학생 + 프로젝터</button>
          <button type="button" data-open="lesson-pdf">현재 차시 PDF</button>
          <button type="button" data-open="course-pdf">전체 교안 PDF</button>
          <button type="button" id="open-pdf-folder">PDF 폴더 열기</button>
          <a id="public-ebook" class="button-link" href="#" target="_blank" rel="noreferrer">공개 e-book</a>
        </div>
      </section>

      <section class="stop-panel" aria-labelledby="stop-title">
        <div>
          <p class="section-label">SAFE SHUTDOWN</p>
          <h2 id="stop-title">강의 종료</h2>
          <p>이 창을 닫는 것만으로는 서버가 종료되지 않을 수 있습니다. 아래 버튼이나 <strong>강의_종료.cmd</strong>를 사용하세요.</p>
        </div>
        <button id="stop-server" class="button button--danger" type="button">강의 서버 안전 종료</button>
      </section>
    </main>

    <script src="/hub/app.js" defer></script>
  </body>
</html>
